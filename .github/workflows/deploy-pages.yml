name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - script.js
      - style.css
      - images/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static website
        run: |
          mkdir -p _site/images
          cp index.html script.js style.css _site/
          cp images/pooja-rajputt-home.png images/pooja-rajputt-about.png images/pooja-rajputt.jpg _site/images/
          cp IMG_20261026_004103.jpg _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
